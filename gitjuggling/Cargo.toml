[package]
name = "gitjuggling"
version = "0.1.0"
edition = "2024"
description = "A tool to sync local git repositories with upstream GitHub/Forgejo remotes and run git commands across multiple repositories"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
jwalk = "0.8"
ratatui = "0.30.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
ureq = "3"

[dev-dependencies]
tempfile = "3"
