name: Release binaries

on:
  push:
    tags:
      - "*/v*"

jobs:
  build:
    name: Build ${{ matrix.package }} for ${{ matrix.target }}
    runs-on: debian-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: zoekt-reindex
            target: x86_64-unknown-linux-gnu
          - package: zoekt-reindex
            target: aarch64-apple-darwin
            zigbuild: true
          - package: ansible-password-agent
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          ssh-known-hosts: ${{ vars.SSH_KNOWN_HOSTS }}

      - name: Install Rust toolchain
        uses: https://github.com/dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: https://github.com/Swatinem/rust-cache@v2

      - name: Install zig
        if: ${{ matrix.zigbuild }}
        uses: https://github.com/goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild
        if: ${{ matrix.zigbuild }}
        run: cargo install cargo-zigbuild

      - name: Build (native)
        if: ${{ !matrix.zigbuild }}
        run: cargo build --release --locked -p ${{ matrix.package }} --target ${{ matrix.target }}

      - name: Build (cross-compile via zigbuild)
        if: ${{ matrix.zigbuild }}
        run: cargo zigbuild --release --locked -p ${{ matrix.package }} --target ${{ matrix.target }}

      - name: Package
        id: package
        run: |
          set -euo pipefail
          pkg="${{ matrix.package }}"
          version="${FORGEJO_REF_NAME#v}"
          target="${{ matrix.target }}"
          archive="${pkg}-${version}-${target}.tar.gz"
          stagedir="dist/stage"
          mkdir -p "${stagedir}" dist/release

          cp "target/${target}/release/${pkg}" "${stagedir}/"

          # Include extra assets per package.
          case "$pkg" in
            ansible-password-agent)
              cp ansible-password-agent/assets/fish/vendor_conf.d/ansible-password-agent.fish "${stagedir}/"
              ;;
          esac

          tar -C "${stagedir}" -czf "dist/release/${archive}" .
          echo "archive=dist/release/${archive}" >> "$FORGEJO_OUTPUT"
        env:
          FORGEJO_REF_NAME: ${{ forge.ref_name }}

      - name: Upload build artifact
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: ${{ matrix.package }}-${{ matrix.target }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

  release:
    name: Publish Forgejo release
    runs-on: debian-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          path: dist/release
          merge-multiple: true

      - name: Create release and upload assets
        uses: https://code.forgejo.org/actions/forgejo-release@v2.11.3
        with:
          direction: upload
          token: ${{ secrets.RELEASE_TOKEN }}
