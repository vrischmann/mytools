name: Release ansible-password-agent

on:
  push:
    tags:
      - "ansible-password-agent/v*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p ansible-password-agent --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#ansible-password-agent/v}"
          target="${{ matrix.target }}"
          archive="ansible-password-agent-${version}-${target}.tar.gz"
          mkdir -p dist

          cp "target/${target}/release/ansible-password-agent" dist/
          cp ansible-password-agent/assets/fish/vendor_conf.d/ansible-password-agent.fish dist/

          tar -C dist -czf "$archive" .
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ansible-password-agent-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    name: Publish GitHub release and Homebrew PR
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout mytools
        uses: actions/checkout@v6

      - name: Extract version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#ansible-password-agent/v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.ref_name }}

      - name: Clone Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: vrischmann/homebrew-tap
          token: ${{ secrets.TAP_REPO_PAT }}
          path: tap-repo

      - name: Patch formula
        shell: bash
        run: |
          uv run .github/scripts/patch-formula.py \
            --formula tap-repo/Formula/ansible-password-agent.rb \
            --version "${{ steps.version.outputs.value }}" \
            --artifacts dist

      - name: Open Homebrew PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.TAP_REPO_PAT }}
          path: tap-repo
          base: main
          branch: bump/ansible-password-agent-${{ steps.version.outputs.value }}
          commit-message: "chore: bump ansible-password-agent to ${{ steps.version.outputs.value }}"
          title: "ansible-password-agent ${{ steps.version.outputs.value }}"
          body: |
            Automated version bump.

            **Release:** https://github.com/vrischmann/mytools/releases/tag/${{ github.ref_name }}
